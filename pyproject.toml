[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "elevator-sim"
version = "0.1.0"
description = "A discrete-time elevator simulation using LOOK scheduling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
elevator-sim = "elevator_sim.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/elevator_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
